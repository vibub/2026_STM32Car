<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">连杆机构坐标、角度和尺寸定义</title>
  <desc id="desc">A为原点，B和G固定，BD与CD刚性连接，CF为单连杆，GF为舵机摇臂。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .point { fill: #fff; stroke: #0f172a; stroke-width: 2.5; }
      .axis { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .dimension { stroke: #64748b; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="920" height="520" fill="#ffffff"/>

  <text x="34" y="36" font-size="22" font-weight="600">机构坐标、尺寸与角度定义（θ = 0°）</text>
  <text class="small" x="34" y="62">所有长度均为转轴或连接孔的中心距，单位：cm</text>

  <!-- Coordinate axes -->
  <line class="axis" x1="90" y1="405" x2="790" y2="405"/>
  <line class="axis" x1="90" y1="405" x2="90" y2="82"/>
  <text x="800" y="411">+x</text>
  <text x="76" y="75">+y</text>

  <!-- Fixed support and mechanism at theta=0 -->
  <line x1="90" y1="405" x2="90" y2="180" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
  <line x1="90" y1="180" x2="715" y2="180" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <line x1="715" y1="180" x2="715" y2="242.5" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="715" y1="242.5" x2="544.0" y2="287.4" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  <line x1="565" y1="330" x2="544.0" y2="287.4" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>

  <!-- Servo body -->
  <rect x="536" y="315" width="58" height="46" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text class="small" x="606" y="344">舵机</text>

  <!-- Angle references -->
  <line class="guide" x1="90" y1="180" x2="220" y2="180"/>
  <text x="150" y="170" fill="#2563eb">θ = 0°</text>

  <line class="guide" x1="565" y1="330" x2="647" y2="330"/>
  <path d="M616 330 A51 51 0 0 0 542.4 284.3" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="446" y="245" fill="#b45309">φ = 116.23°</text>

  <!-- Dimension lines -->
  <line class="guide" x1="72" y1="405" x2="42" y2="405"/>
  <line class="guide" x1="72" y1="180" x2="42" y2="180"/>
  <line class="dimension" x1="50" y1="399" x2="50" y2="186"/>
  <text x="8" y="288">AB</text>
  <text x="8" y="309">= 9</text>

  <line class="dimension" x1="98" y1="151" x2="707" y2="151"/>
  <line class="guide" x1="90" y1="166" x2="90" y2="143"/>
  <line class="guide" x1="715" y1="166" x2="715" y2="143"/>
  <text x="370" y="140">BD = 25</text>

  <line class="dimension" x1="742" y1="186" x2="742" y2="236"/>
  <text x="758" y="216">CD = 2.5</text>

  <line class="dimension" x1="98" y1="438" x2="557" y2="438"/>
  <line class="guide" x1="90" y1="414" x2="90" y2="446"/>
  <line class="guide" x1="565" y1="344" x2="565" y2="446"/>
  <text x="285" y="462">AG 水平距离 g = 19</text>

  <text x="612" y="224" fill="#15803d">CF = 7.0717</text>
  <text x="456" y="324" fill="#b45309">GF = 1.9</text>
  <text class="small" x="602" y="365">G 高度 = 3</text>

  <!-- Points -->
  <g>
    <circle class="point" cx="90" cy="405" r="6"/><text x="68" y="430">A</text>
    <circle class="point" cx="90" cy="180" r="6"/><text x="66" y="168">B</text>
    <circle class="point" cx="715" cy="180" r="6"/><text x="726" y="171">D</text>
    <circle class="point" cx="715" cy="242.5" r="6"/><text x="727" y="251">C</text>
    <circle class="point" cx="544.0" cy="287.4" r="6"/><text x="520" y="280">F</text>
    <circle class="point" cx="565" cy="330" r="6"/><text x="548" y="385">G</text>
  </g>

  <g transform="translate(40 490)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="7"/><text x="48" y="6">BD/CD 输出构件</text>
    <line x1="230" y1="0" x2="268" y2="0" stroke="#16a34a" stroke-width="7"/><text x="278" y="6">CF 单连杆</text>
    <line x1="440" y1="0" x2="478" y2="0" stroke="#f59e0b" stroke-width="7"/><text x="488" y="6">GF 舵机摇臂</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">BD俯仰角和舵机摇臂角标定曲线</title>
  <desc id="desc">横轴为BD俯仰角负六度到正六度，纵轴为舵机摇臂绝对角，曲线单调下降且具有非线性。</desc>
  <defs>
    <style>
      text { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #0f172a; font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; }
    </style>
  </defs>
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="34" y="36" font-size="22" font-weight="600">BD 俯仰角—舵机摇臂角标定曲线</text>
  <text class="small" x="34" y="62">AG = 19.0 cm，CF = 7.0717 cm；φ 从 +x 轴起逆时针为正</text>

  <!-- Grid -->
  <g>
    <line class="grid" x1="90" y1="96" x2="690" y2="96"/>
    <line class="grid" x1="90" y1="148" x2="690" y2="148"/>
    <line class="grid" x1="90" y1="200" x2="690" y2="200"/>
    <line class="grid" x1="90" y1="252" x2="690" y2="252"/>
    <line class="grid" x1="90" y1="304" x2="690" y2="304"/>
    <line class="grid" x1="90" y1="356" x2="690" y2="356"/>
    <line class="grid" x1="90" y1="96" x2="90" y2="356"/>
    <line class="grid" x1="190" y1="96" x2="190" y2="356"/>
    <line class="grid" x1="290" y1="96" x2="290" y2="356"/>
    <line class="grid" x1="390" y1="96" x2="390" y2="356"/>
    <line class="grid" x1="490" y1="96" x2="490" y2="356"/>
    <line class="grid" x1="590" y1="96" x2="590" y2="356"/>
    <line class="grid" x1="690" y1="96" x2="690" y2="356"/>
  </g>

  <line class="axis" x1="90" y1="356" x2="710" y2="356"/>
  <line class="axis" x1="90" y1="376" x2="90" y2="82"/>

  <!-- Mechanical installation center -->
  <line x1="90" y1="226.2" x2="690" y2="226.2" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="704" y="231" fill="#b45309">中位安装角 107.44°</text>

  <!-- Calibration curve -->
  <path d="M90 112.1 L140 124.5 L190 137.4 L240 150.9 L290 165.0 L340 179.9 L390 195.7 L440 212.7 L490 231.1 L540 251.5 L590 274.9 L640 302.9 L690 340.3"
        fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#2563eb" stroke-width="2.5">
    <circle cx="90" cy="112.1" r="5"/><circle cx="140" cy="124.5" r="4"/>
    <circle cx="190" cy="137.4" r="4"/><circle cx="240" cy="150.9" r="4"/>
    <circle cx="290" cy="165.0" r="4"/><circle cx="340" cy="179.9" r="4"/>
    <circle cx="390" cy="195.7" r="5"/><circle cx="440" cy="212.7" r="4"/>
    <circle cx="490" cy="231.1" r="4"/><circle cx="540" cy="251.5" r="4"/>
    <circle cx="590" cy="274.9" r="4"/><circle cx="640" cy="302.9" r="4"/>
    <circle cx="690" cy="340.3" r="5"/>
  </g>

  <!-- Axis labels -->
  <g text-anchor="middle">
    <text x="90" y="380">−6</text><text x="190" y="380">−4</text>
    <text x="290" y="380">−2</text><text x="390" y="380">0</text>
    <text x="490" y="380">+2</text><text x="590" y="380">+4</text>
    <text x="690" y="380">+6</text>
  </g>
  <g text-anchor="end">
    <text x="80" y="101">145</text><text x="80" y="153">130</text>
    <text x="80" y="205">115</text><text x="80" y="257">100</text>
    <text x="80" y="309">85</text><text x="80" y="361">70</text>
  </g>
  <text x="330" y="415" font-size="17">BD 俯仰角 θ（°）</text>
  <text x="28" y="275" font-size="17" transform="rotate(-90 28 275)">舵机摇臂绝对角 φ（°）</text>

  <!-- Key values -->
  <line x1="90" y1="112.1" x2="180" y2="82" stroke="#64748b" stroke-width="1.5"/>
  <text x="188" y="84">θ = −6°，φ = 140.36°</text>
  <line x1="390" y1="195.7" x2="512" y2="157" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="147">θ = 0°，φ = 116.23°</text>
  <line x1="690" y1="340.3" x2="744" y2="350" stroke="#64748b" stroke-width="1.5"/>
  <text x="752" y="355">θ = +6°</text>
  <text x="752" y="376">φ = 74.52°</text>

  <rect x="715" y="105" width="165" height="88" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="733" y="132" font-weight="600">曲线特性</text>
  <text class="small" x="733" y="157">• 单调，可唯一反算</text>
  <text class="small" x="733" y="180">• 总舵机行程 65.83°</text>
</svg>
